name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Tgoh/treflex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Each build's switch links to the other at the path the assemble step puts it.
      - run: npm --prefix demos/portal run build
        env:
          VITE_OTHER_BUILD_URL: ./react/
      - run: npm --prefix demos/react-portal run build
        env:
          VITE_OTHER_BUILD_URL: ../
      - name: Assemble the site
        run: |
          mkdir site
          cp -r demos/portal/dist/. site/
          cp -r demos/react-portal/dist site/react
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
