name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Tgoh/treflex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      # The Solid and React builds' switches link to each other at the paths the assemble step puts them.
      - run: npm --prefix demos/portal run build
        env:
          VITE_OTHER_BUILD_URL: ./react/
      - run: npm --prefix demos/react-portal run build
        env:
          VITE_OTHER_BUILD_URL: ../
      - run: npm --prefix demos/portal-swap run build
      # The base is the path the assemble step puts the docs at, under the repo's Pages root.
      - run: npm run docs:build -- --base /treflex/docs/
      - name: Assemble the site
        run: |
          mkdir site
          cp -r demos/portal/dist/. site/
          cp -r demos/react-portal/dist site/react
          cp -r demos/portal-swap/dist site/swap
          cp -r docs/.vitepress/dist site/docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
