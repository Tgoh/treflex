name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Tgoh/treflex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm
      # npm's trusted publishing, which each package's settings on npmjs.com name this workflow for, needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run release:pack
      - name: Publish each package whose version isn't on npm yet
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          for name in treflex treflex-solid treflex-react treflex-eslint create-treflex; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm"
            else
              npm publish "./release/$name-$version.tgz"
            fi
          done
